# Weekly check for new upstream PySwitch commits (Tunetown/PySwitch main). If there are any, merges them on top
# of main, runs the tests and opens a pull request for review (or an issue on conflicts).
#
# Security: the upstream code is third party code. It is only executed in the "test" job, which has a read-only
# token that is not stored in the checkout, so it cannot push or change anything. The "publish" job, which may
# push a branch and open the pull request, only merges with git (no upstream code is executed there).
# Nothing is merged into main automatically.
name: Upstream sync

on:
  schedule:
    - cron: "0 3 * * 1"      # Mondays 03:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      count: ${{ steps.merge.outputs.count }}
      upstream: ${{ steps.merge.outputs.upstream }}
      conflict: ${{ steps.merge.outputs.conflict }}
      conflicts: ${{ steps.merge.outputs.conflicts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and merge upstream (locally)
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Tunetown/PySwitch.git
          git fetch upstream main
          count=$(git rev-list --count HEAD..upstream/main)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "upstream=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"
          echo "New upstream commits: $count"
          if [ "$count" = "0" ]; then exit 0; fi
          if git merge --no-edit upstream/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "conflicts=$(git diff --name-only --diff-filter=U | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        if: steps.merge.outputs.count != '0' && steps.merge.outputs.conflict == 'false'
        with:
          python-version: "3.12"

      - name: Test the merge
        if: steps.merge.outputs.count != '0' && steps.merge.outputs.conflict == 'false'
        run: |
          python -m unittest discover -s multimode/tests
          python multimode/tools/mmtool.py validate
          mkdir -p /tmp/project/test
          touch /tmp/project/test/__init__.py
          ln -s "$PWD/content/lib" /tmp/project/lib
          ln -s "$PWD/test/pyswitch" /tmp/project/test/pyswitch
          (cd /tmp/project && python -m unittest discover -t /tmp/project -s /tmp/project/test/pyswitch)

  publish:
    needs: test
    if: needs.test.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Open a pull request
        if: needs.test.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ needs.test.outputs.upstream }}
          COUNT: ${{ needs.test.outputs.count }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/Tunetown/PySwitch.git "$UPSTREAM"
          branch="upstream-sync/$(date +%Y%m%d)"
          git switch -c "$branch"
          git merge --no-edit "$UPSTREAM"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Upstream PySwitch: $COUNT new commit(s)" \
            --body "Merged Tunetown/PySwitch main ($UPSTREAM) into main. Multimode tests, profile validation and the PySwitch test suite passed. Please test on the device before merging."

      - name: Report conflicts
        if: needs.test.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ needs.test.outputs.count }}
          CONFLICTS: ${{ needs.test.outputs.conflicts }}
        run: |
          gh issue create --title "Upstream PySwitch merge conflicts" \
            --body "Merging Tunetown/PySwitch main ($COUNT new commits) into main conflicts in: $CONFLICTS. Merge locally: git fetch origin && git merge origin/main" \
          || echo "Could not open an issue (issues may be disabled). Conflicts: $CONFLICTS"
